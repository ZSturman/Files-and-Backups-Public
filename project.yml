name: FilesBackups
options:
  bundleIdPrefix: com.zacharysturman.filesbackups
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YOURTEAMID
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: true
    CODE_SIGN_STYLE: Automatic

packages:
  HomeServicesConnection:
    path: Vendor/HomeServicesConnection
  FileCore:
    path: Packages/FileCore

targets:
  FilesBackups:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: HomeServicesConnection
      - package: FileCore
        product: FileCore
      - package: FileCore
        product: FileCoreSMB
      - package: FileCore
        product: FileCoreSFTP
      - package: FileCore
        product: BackupCore
      - target: FilesBackupsShare
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharysturman.filesbackups
        PRODUCT_NAME: FilesBackups
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/FilesBackups-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Entitlements/FilesBackups-macOS.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    info:
      path: Generated/FilesBackups-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.zacharysturman.filesbackups
            CFBundleURLSchemes: [filesbackups]
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Files & Backups
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan a one-use Raspberry Pi connection invitation.
        NSLocalNetworkUsageDescription: Files & Backups connects to file shares on your local network, such as a Mac, PC, NAS, or Raspberry Pi.
        NSBonjourServices:
          - _smb._tcp
        LSSupportsOpeningDocumentsInPlace: false

  FilesBackupsShare:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: App/ShareExtension
    dependencies:
      - package: FileCore
        product: FileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharysturman.filesbackups.share
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/FilesBackupsShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    info:
      path: Generated/FilesBackupsShare-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Files & Backups
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50

  FilesBackupsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharysturman.filesbackups.UITests
        TEST_TARGET_NAME: FilesBackups
    dependencies:
      - target: FilesBackups

  FilesBackupsMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: App/MacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharysturman.filesbackups.MacUITests
        TEST_TARGET_NAME: FilesBackups
    dependencies:
      - target: FilesBackups

schemes:
  FilesBackups:
    build:
      targets:
        FilesBackups: all
        FilesBackupsUITests: [test]
        FilesBackupsMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FilesBackupsUITests
        - FilesBackupsMacUITests
